# Docker environment configuration
server.port=8081

spring.application.name=auth-service

# JWT Configuration
jwt.secret=${JWT_SECRET:sprint-secret-key-shared-across-all-microservices-2024}

# DATABASE - Docker containers
spring.datasource.url=jdbc:postgresql://postgres-auth:5432/auth_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# EUREKA - Docker containers
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.instance.hostname=auth-service
eureka.instance.prefer-ip-address=true

# RABBITMQ - Docker containers
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# CONFIG SERVER - Docker containers
spring.config.import=optional:configserver:http://config-server:8888

# ZIPKIN
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics