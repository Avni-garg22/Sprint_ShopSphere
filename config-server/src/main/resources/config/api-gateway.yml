server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
