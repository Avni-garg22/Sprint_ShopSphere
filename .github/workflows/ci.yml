name: Sprint Microservices CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ─────────────────────────────────────────
  # JOB 1 - Build and Test Java Services
  # ─────────────────────────────────────────
  build-java:
    name: Build & Test Java Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build All Java Services
        run: |
          mvn -B --no-transfer-progress clean package -DskipTests --file eureka-server/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file config-server/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file auth-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file catalog-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file order-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file payment-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file admin-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file notification-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file api-gateway/pom.xml

  # ─────────────────────────────────────────
  # JOB 2 - Build Angular Frontend
  # ─────────────────────────────────────────
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: sprint-frontend
        run: npm install

      - name: Build Angular App
        working-directory: sprint-frontend
        run: npm run build -- --configuration production

  # ─────────────────────────────────────────
  # JOB 3 - Build and Push Docker Images
  # ─────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ build-java, build-frontend ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR files for Docker
        run: |
          mvn -B --no-transfer-progress clean package -DskipTests --file eureka-server/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file config-server/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file auth-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file catalog-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file order-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file payment-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file admin-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file notification-service/pom.xml
          mvn -B --no-transfer-progress clean package -DskipTests --file api-gateway/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Eureka Server
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-eureka-server:latest ./eureka-server
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-eureka-server:latest

      - name: Build and Push Config Server
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-config-server:latest ./config-server
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-config-server:latest

      - name: Build and Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-auth-service:latest ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-auth-service:latest

      - name: Build and Push Catalog Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-catalog-service:latest ./catalog-service
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-catalog-service:latest

      - name: Build and Push Order Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-order-service:latest ./order-service
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-order-service:latest

      - name: Build and Push Payment Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-payment-service:latest ./payment-service
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-payment-service:latest

      - name: Build and Push Admin Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-admin-service:latest ./admin-service
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-admin-service:latest

      - name: Build and Push Notification Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-notification-service:latest ./notification-service
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-notification-service:latest

      - name: Build and Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-api-gateway:latest

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sprint-frontend:latest ./sprint-frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/sprint-frontend:latest

      - name: Summary
        run: echo "✅ All 10 images pushed to Docker Hub successfully!"
