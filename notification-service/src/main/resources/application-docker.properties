server.port=8086
spring.application.name=notification-service

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.hostname=notification-service
eureka.instance.prefer-ip-address=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

jwt.secret=${JWT_SECRET:sprint-secret-key-shared-across-all-microservices-2024}

spring.datasource.url=jdbc:postgresql://postgres-notification:5432/notification_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,metrics

spring.config.import=optional:configserver:http://config-server:8888
