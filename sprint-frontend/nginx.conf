server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy all API calls to the gateway
  location /gateway/ {
    proxy_pass http://api-gateway:8080/gateway/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Expose Authorization header so Angular can read the JWT on login
    proxy_pass_header Authorization;
    add_header Access-Control-Expose-Headers Authorization always;
  }

  # Proxy product image uploads served by catalog-service
  location /uploads/ {
    proxy_pass http://catalog-service:8084/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Angular SPA — all other routes fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
