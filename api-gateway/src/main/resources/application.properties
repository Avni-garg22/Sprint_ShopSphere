server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888

spring.main.web-application-type=reactive
spring.codec.max-in-memory-size=10MB

# Eureka - fix WSL hostname issue
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Swagger Aggregation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/gateway/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=catalog-service
springdoc.swagger-ui.urls[1].url=/gateway/catalog/v3/api-docs
springdoc.swagger-ui.urls[2].name=payment-service
springdoc.swagger-ui.urls[2].url=/gateway/payment/v3/api-docs
springdoc.swagger-ui.urls[3].name=order-service
springdoc.swagger-ui.urls[3].url=/gateway/orders/v3/api-docs
springdoc.swagger-ui.urls[4].name=admin-service
springdoc.swagger-ui.urls[4].url=/gateway/admin/v3/api-docs
springdoc.swagger-ui.urls[5].name=notification-service
springdoc.swagger-ui.urls[5].url=/gateway/notify/v3/api-docs